<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Training" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Alex's Training</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    body { font-family: -apple-system, 'Inter', 'Helvetica Neue', sans-serif; background: #0a0a0a; color: #e8e8e8; min-height: 100vh; min-height: -webkit-fill-available; }
    html { height: -webkit-fill-available; }

    #app { display: flex; flex-direction: column; min-height: 100vh; min-height: -webkit-fill-available; }

    /* Header */
    #header { background: #0f0f0f; border-bottom: 1px solid #1a1a1a; padding: env(safe-area-inset-top, 20px) 16px 0; padding-top: max(env(safe-area-inset-top), 20px); position: sticky; top: 0; z-index: 100; }
    #header-top { padding-bottom: 14px; }
    .header-eyebrow { font-size: 10px; letter-spacing: 0.2em; color: #444; text-transform: uppercase; margin-bottom: 3px; }
    .header-title { font-size: 20px; font-weight: 800; letter-spacing: -0.03em; color: #f0f0f0; margin-bottom: 2px; }
    .header-sub { font-size: 11px; color: #444; }

    /* Day tabs */
    #day-tabs { display: flex; gap: 3px; overflow-x: hidden; }
    .day-tab { flex: 1; min-width: 0; padding: 10px 4px 8px; border: none; border-radius: 8px 8px 0 0; background: #161616; color: #555; font-weight: 700; font-size: 11px; letter-spacing: 0.05em; cursor: pointer; text-align: center; transition: background 0.15s, color 0.15s; border-top: 2px solid transparent; }
    .day-tab.active { color: #fff; }
    .day-tab-emoji { font-size: 14px; margin-top: 2px; }

    /* Main content */
    #content { padding: 18px 16px; max-width: 700px; margin: 0 auto; padding-bottom: calc(env(safe-area-inset-bottom) + 24px); flex: 1; }

    /* Day header */
    .day-tag { font-size: 10px; letter-spacing: 0.15em; font-weight: 800; text-transform: uppercase; margin-bottom: 6px; }
    .day-title { font-size: 24px; font-weight: 900; letter-spacing: -0.03em; margin-bottom: 8px; line-height: 1.1; }
    .day-title span { color: #333; font-weight: 400; }
    .day-why { color: #666; font-size: 12px; line-height: 1.6; margin-bottom: 18px; }

    /* Back note */
    .back-note { background: #110a00; border: 1px solid rgba(245,158,11,0.2); border-left: 3px solid #f59e0b; border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; font-size: 11px; color: #886633; line-height: 1.5; }
    .back-note-label { color: #f59e0b; font-weight: 800; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; }

    /* Sections */
    .section { margin-bottom: 12px; }
    .section-header { width: 100%; background: none; border: none; cursor: pointer; padding: 4px 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .section-header-left { display: flex; align-items: center; gap: 8px; }
    .section-bar { width: 3px; height: 16px; border-radius: 2px; flex-shrink: 0; }
    .section-title { font-size: 12px; font-weight: 700; color: #ccc; text-align: left; }
    .section-badge { font-size: 9px; font-weight: 700; letter-spacing: 0.1em; padding: 2px 6px; border-radius: 4px; }
    .section-chevron { font-size: 11px; color: #444; transition: transform 0.2s; }
    .section-note { font-size: 11px; color: #555; margin-bottom: 8px; padding-left: 11px; font-style: italic; line-height: 1.5; }

    /* Exercise table */
    .ex-col-headers { display: grid; gap: 8px; padding: 0 14px 6px; }
    .ex-col-headers.trackable { grid-template-columns: 1fr 80px 100px; }
    .ex-col-headers.standard { grid-template-columns: 1fr auto; }
    .col-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: #333; }
    .col-label.accent { }

    .ex-list { background: #111; border-radius: 10px; border: 1px solid #1a1a1a; overflow: hidden; }
    .ex-row { display: grid; gap: 8px; padding: 11px 14px; align-items: center; border-bottom: 1px solid #161616; }
    .ex-row:last-child { border-bottom: none; }
    .ex-row.trackable { grid-template-columns: 1fr 80px 100px; }
    .ex-row.standard { grid-template-columns: 1fr auto; }
    .ex-name { font-size: 13px; font-weight: 600; color: #ddd; }
    .ex-note-text { font-size: 11px; color: #555; line-height: 1.4; margin-top: 3px; }
    .sets-badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 6px; white-space: nowrap; text-align: center; display: inline-block; }

    /* Weight input */
    .weight-cell { text-align: center; }
    .weight-btn { border-radius: 6px; font-size: 12px; font-weight: 400; padding: 4px 8px; cursor: pointer; width: 100%; min-height: 30px; transition: all 0.15s; border-width: 1px; border-style: solid; }
    .weight-btn.empty { background: #1a1a1a; border-color: #2a2a2a; color: #444; }
    .weight-btn.filled { font-weight: 700; }
    .weight-input-wrap { display: flex; gap: 4px; align-items: center; justify-content: center; }
    .weight-input { width: 62px; font-size: 12px; background: #1a1a1a; border-radius: 6px; color: #fff; padding: 5px 6px; text-align: center; outline: none; border-width: 1px; border-style: solid; -webkit-appearance: none; }
    .weight-save-btn { border: none; border-radius: 6px; color: #fff; font-weight: 800; font-size: 14px; cursor: pointer; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .track-hint { font-size: 10px; color: #333; margin-top: 5px; padding-left: 4px; font-style: italic; }

    /* Week grid */
    .week-section { margin-top: 28px; border-top: 1px solid #161616; padding-top: 20px; }
    .section-eyebrow { font-size: 10px; color: #333; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 10px; }
    .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
    .week-btn { border-radius: 8px; padding: 10px 4px; cursor: pointer; text-align: center; transition: all 0.15s; border-width: 1px; border-style: solid; }
    .week-btn-day { font-size: 9px; font-weight: 700; letter-spacing: 0.05em; margin-bottom: 4px; }
    .week-btn-emoji { font-size: 15px; }
    .week-btn-label { font-size: 8px; margin-top: 3px; line-height: 1.2; }

    /* Principles */
    .principles { margin-top: 20px; background: #0f0f0f; border: 1px solid #1a1a1a; border-radius: 12px; padding: 18px 16px; }
    .principle { padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid #161616; }
    .principle:last-child { padding-bottom: 0; margin-bottom: 0; border-bottom: none; }
    .principle-title { font-size: 12px; font-weight: 700; color: #aaa; margin-bottom: 3px; }
    .principle-note { font-size: 12px; color: #555; line-height: 1.6; }

    .hidden { display: none; }

    /* Edit mode */
    .edit-toggle { border: none; border-radius: 8px; font-size: 11px; font-weight: 700; padding: 6px 14px; cursor: pointer; transition: all 0.15s; letter-spacing: 0.05em; }
    .edit-toggle.off { background: #1a1a1a; color: #555; }
    .edit-toggle.on { background: #f59e0b; color: #000; }
    .edit-banner { background: #110f00; border: 1px solid #f59e0b44; border-radius: 8px; padding: 8px 12px; margin-bottom: 14px; font-size: 11px; color: #886633; }
    /* Editable fields for habits, notes, principles */
    .editable-wrap { position: relative; }
    .editable-tap { position: absolute; top: 6px; right: 6px; background: none; border: none; color: #333; font-size: 12px; cursor: pointer; padding: 2px 4px; }
    .editable-tap:active { color: #f59e0b; }
    .editable-textarea { width: 100%; background: #111; border: 1px solid #f59e0b; border-radius: 6px; color: #e8e8e8; font-size: 11px; padding: 7px 10px; outline: none; -webkit-appearance: none; font-family: inherit; resize: none; line-height: 1.5; margin-top: 6px; }
    .principle-edit-wrap { position: relative; padding-right: 24px; }
    .principle-textarea { width: 100%; background: #0f0f0f; border: 1px solid #f59e0b; border-radius: 6px; color: #888; font-size: 12px; padding: 6px 8px; outline: none; -webkit-appearance: none; font-family: inherit; resize: none; line-height: 1.6; margin-top: 4px; }
    .ex-row.editing { grid-template-columns: 1fr !important; gap: 6px !important; padding: 12px 14px !important; background: #131313; }
    .edit-field-label { font-size: 9px; color: #444; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 3px; }
    .edit-input { width: 100%; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 6px; color: #e8e8e8; font-size: 12px; padding: 7px 10px; outline: none; -webkit-appearance: none; font-family: inherit; }
    .edit-input:focus { border-color: #f59e0b; }
    .edit-input.sets { width: 120px; }
    .edit-actions { display: flex; gap: 6px; margin-top: 4px; }
    .edit-save-btn { background: #22c55e; border: none; border-radius: 6px; color: #000; font-size: 11px; font-weight: 800; padding: 6px 14px; cursor: pointer; }
    .edit-cancel-btn { background: #1a1a1a; border: none; border-radius: 6px; color: #666; font-size: 11px; font-weight: 700; padding: 6px 14px; cursor: pointer; }
    .delete-btn { background: none; border: none; color: #444; font-size: 16px; cursor: pointer; padding: 0 4px; line-height: 1; flex-shrink: 0; }
    .delete-btn:active { color: #ef4444; }
    .edit-ex-row { display: flex; align-items: center; gap: 8px; }
    .edit-ex-info { flex: 1; min-width: 0; }
    .pencil-btn { background: none; border: none; color: #333; font-size: 13px; cursor: pointer; padding: 0 4px; flex-shrink: 0; }
    .pencil-btn:active { color: #f59e0b; }
    .add-ex-btn { width: 100%; background: #111; border: 1px dashed #2a2a2a; border-radius: 8px; color: #444; font-size: 12px; font-weight: 600; padding: 10px; cursor: pointer; margin-top: 6px; transition: all 0.15s; }
    .add-ex-btn:active { border-color: #f59e0b; color: #f59e0b; }
    .adding-row { background: #131313; border: 1px solid #2a2a2a; border-radius: 8px; padding: 12px 14px; margin-top: 6px; }
    .adding-row .edit-input:focus { border-color: #22c55e; }
  </style>
</head>

// ── State ──────────────────────────────────────────────────────────────
let activeDay = ((new Date().getDay() + 6) % 7);
let expandedSections = {};
let editMode = false;
let editingEx = null;   // {si, ei} currently open inline editor
let addingTo = null;    // si of section currently adding to
let dragState = null;   // drag/reorder state

// Custom overrides saved per exercise: lsKey → {name,sets,note}
// Deleted exercises: delKey → true
// Extra exercises: addKey → [{name,sets,note},...]
// Order overrides: ordKey → [ei, ei, ei, ...]  (indices into merged list)

function lsKey(di,si,ei)  { return `ex_${di}_${si}_${ei}`; }
function delKey(di,si,ei) { return `del_${di}_${si}_${ei}`; }
function addKey(di,si)    { return `add_${di}_${si}`; }
function ordKey(di,si)    { return `ord_${di}_${si}`; }
function wtKey(di,si,ei)  { return `wt_${di}_${si}_${ei}`; }
function backNoteKey(di)  { return `backnote_${di}`; }
function secNoteKey(di,si){ return `secnote_${di}_${si}`; }
function princKey(pi)     { return `princ_${pi}`; }

const NS = 'v2_';
function lsGet(k)      { try { return localStorage.getItem(NS+k); } catch(e){ return null; } }
function lsSet(k,v)    { try { localStorage.setItem(NS+k,v); } catch(e){} }
function lsDel(k)      { try { localStorage.removeItem(NS+k); } catch(e){} }

// Build the merged exercise list for a section, applying overrides + order
function sectionExercises(di, si) {
  const sec = schedule[di].sections[si];
  // Base exercises (excluding deleted)
  let base = sec.exercises.map((ex, ei) => {
    if (lsGet(delKey(di,si,ei))) return null;
    const over = lsGet(lsKey(di,si,ei));
    if (over) { try { return {...ex, ...JSON.parse(over), _ei: ei}; } catch(e){} }
    return {...ex, _ei: ei};
  }).filter(Boolean);

  // Added exercises (appended)
  const added = lsGet(addKey(di,si));
  let extras = [];
  if (added) { try { extras = JSON.parse(added).map((ex,i) => ({...ex, _ei: 10000+i})); } catch(e){} }

  let all = [...base, ...extras];

  // Apply order override
  const ord = lsGet(ordKey(di,si));
  if (ord) {
    try {
      const order = JSON.parse(ord);
      const mapped = order.map(id => all.find(e => e._ei === id)).filter(Boolean);
      // Append any not in order (safety)
      const inOrd = new Set(order);
      const rest = all.filter(e => !inOrd.has(e._ei));
      all = [...mapped, ...rest];
    } catch(e){}
  }
  return all;
}

function saveOrder(di, si, exList) {
  lsSet(ordKey(di,si), JSON.stringify(exList.map(e => e._ei)));
}

function typeAccent(type) { return ACCENT[type] || "#888"; }

// ── Render ─────────────────────────────────────────────────────────────
function render() { renderTabs(); renderContent(); }

function renderTabs() {
  const tabs = document.getElementById('day-tabs');
  tabs.innerHTML = '';
  schedule.forEach((d,i) => {
    const a = typeAccent(d.type);
    const active = i === activeDay;
    const btn = document.createElement('button');
    btn.className = 'day-tab' + (active?' active':'');
    btn.style.background = active ? a : '#161616';
    btn.style.borderTopColor = active ? a : 'transparent';
    btn.innerHTML = `<div>${d.day.slice(0,3).toUpperCase()}</div><div class="day-tab-emoji">${d.emoji}</div>`;
    btn.onclick = () => { activeDay=i; expandedSections={}; editingEx=null; addingTo=null; render(); };
    tabs.appendChild(btn);
  });
  const btn = document.getElementById('edit-btn');
  if (btn) { btn.className = 'edit-toggle ' + (editMode?'on':'off'); btn.textContent = editMode?'Done':'Edit'; }
}

function renderContent() {
  const d = schedule[activeDay];
  const accent = typeAccent(d.type);
  const trackable = TRACKABLE_TYPES.includes(d.type);

  let html = '';

  html += `<div class="day-tag" style="color:${accent}">${d.tag}</div>`;
  html += `<div class="day-title">${d.day}<span> · </span>${d.label}</div>`;
  html += `<div class="day-why">${d.why}</div>`;

  const backNoteVal = lsGet(backNoteKey(activeDay)) || d.backNote;
  if (backNoteVal || editMode) {
    if (editMode) {
      html += `<div class="back-note editable-wrap">
        <span class="back-note-label">Back Note · </span>

        <div id="backnote_${activeDay}_edit" style="display:none">
          <textarea class="editable-textarea" id="backnote_${activeDay}_ta" rows="2">${esc(backNoteVal||'')}</textarea>

        </div>

    html += `<div class="section">`;
    html += `<button class="section-header" onclick="toggleSection('${secKey}')">
      <div class="section-header-left">

      <span class="section-chevron">${expanded?'▲':'▼'}</span>
    </button>`;

    if (expanded) {
      const secNoteVal = lsGet(secNoteKey(activeDay,si)) || sec.note || '';
      if (editMode) {
        html += `<div class="editable-wrap" style="margin-bottom:8px;padding-right:28px;">
          <div id="secnote_${activeDay}_${si}_display" style="font-size:11px;color:#555;font-style:italic;line-height:1.5;">${secNoteVal||'<span style=\'color:#333\'>Tap ✎ to add a note</span>'}</div>

          </div>
        </div>`;
      } else if (secNoteVal) {
        html += `<div class="section-note">${secNoteVal}</div>`;
      }

      if (isTrack && !editMode) {
        html += `<div class="ex-col-headers trackable">
          <div class="col-label">Exercise</div>
          <div class="col-label" style="text-align:center">Sets</div>
          <div class="col-label" style="color:${accent};text-align:center">Your Weight</div>
        </div>`;
      }

      html += `<div class="ex-list" id="exlist_${si}">`;

      exList.forEach((ex, listIdx) => {
        const ei = ex._ei;
        const isEditingThis = editMode && editingEx && editingEx.si===si && editingEx.listIdx===listIdx;
        const wtk = wtKey(activeDay, si, listIdx);
        const saved = lsGet(wtk);

        if (isEditingThis) {
          // Inline editor row
          html += `<div class="ex-row editing">
            <div>
              <div class="edit-field-label">Exercise Name</div>
              <input class="edit-input" id="ename_${si}_${listIdx}" value="${esc(ex.name)}" placeholder="Exercise name" />
            </div>
            <div>
              <div class="edit-field-label">Sets / Reps / Duration</div>
              <input class="edit-input sets" id="esets_${si}_${listIdx}" value="${esc(ex.sets)}" placeholder="e.g. 3×10" />
            </div>
            <div>
              <div class="edit-field-label">Coaching Note</div>
              <input class="edit-input" id="enote_${si}_${listIdx}" value="${esc(ex.note||'')}" placeholder="Optional note" />
            </div>
            <div class="edit-actions">
              <button class="edit-save-btn" onclick="saveExEdit(${si},${listIdx},${ei})">Save</button>
              <button class="edit-cancel-btn" onclick="cancelEdit()">Cancel</button>
            </div>
          </div>`;
        } else if (editMode) {
          // Edit mode view row
          html += `<div class="ex-row standard" id="exrow_${si}_${listIdx}" draggable="false">
            <div class="edit-ex-row">
              <span class="drag-handle" style="color:#333;font-size:16px;cursor:grab;padding:0 6px 0 0;flex-shrink:0;"
                ontouchstart="dragStart(event,${si},${listIdx})"
                ontouchmove="dragMove(event)"
                ontouchend="dragEnd(event,${si})">☰</span>
              <div class="edit-ex-info">
                <div class="ex-name">${esc(ex.name)}</div>
                <div style="display:flex;gap:8px;align-items:center;margin-top:3px;">
                  <span class="sets-badge" style="color:${accent};background:${accent}18;font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;">${esc(ex.sets)}</span>
                </div>
                ${ex.note ? `<div class="ex-note-text">${esc(ex.note)}</div>` : ''}
              </div>
              <button class="pencil-btn" onclick="startExEdit(${si},${listIdx})">✎</button>
              <button class="delete-btn" onclick="deleteEx(${si},${listIdx},${ei})">✕</button>
            </div>
          </div>`;
        } else {
          // Normal view row
          const isWtEditing = !editMode && isTrack && (window._wtEditing === wtk);
          html += `<div class="ex-row ${isTrack?'trackable':'standard'}">`;
          html += `<div><div class="ex-name">${esc(ex.name)}</div>${ex.note?`<div class="ex-note-text">${esc(ex.note)}</div>`:''}
          </div>`;
          html += `<div style="text-align:center"><span class="sets-badge" style="color:${accent};background:${accent}18">${esc(ex.sets)}</span></div>`;
          if (isTrack) {
            if (isWtEditing) {
              html += `<div class="weight-cell"><div class="weight-input-wrap">
                <input class="weight-input" id="wi_${wtk}" style="border-color:${accent}" value="${saved||''}" placeholder="e.g. 25kg" onkeydown="wtKeydown(event,'${wtk}')" />
                <button class="weight-save-btn" style="background:${accent}" onclick="saveWt('${wtk}')">✓</button>
              </div></div>`;
            } else {
              html += `<div class="weight-cell">
                <button class="weight-btn ${saved?'filled':'empty'}"
                  style="${saved?`color:${accent};background:${accent}25;border-color:${accent}`:''}"
                  onclick="startWtEdit('${wtk}')">
                  ${saved ? saved : '<span style="font-size:11px">+ log</span>'}
                </button>
              </div>`;
            }
          }
          html += `</div>`;
        }
      });

      html += `</div>`; // ex-list

      // Add exercise button (edit mode)
      if (editMode) {
        if (addingTo === si) {
          html += `<div class="adding-row">
            <div class="edit-field-label">Exercise Name</div>
            <input class="edit-input" id="add_name_${si}" placeholder="Exercise name" style="margin-bottom:6px;" />
            <div class="edit-field-label">Sets / Reps / Duration</div>
            <input class="edit-input sets" id="add_sets_${si}" placeholder="e.g. 3×10" style="margin-bottom:6px;" />
            <div class="edit-field-label">Coaching Note (Optional)</div>
            <input class="edit-input" id="add_note_${si}" placeholder="Optional note" style="margin-bottom:8px;" />
            <div class="edit-actions">
              <button class="edit-save-btn" onclick="confirmAdd(${si})">Add</button>
              <button class="edit-cancel-btn" onclick="cancelAdd()">Cancel</button>
            </div>
          </div>`;
        } else {
          html += `<button class="add-ex-btn" onclick="startAdd(${si})">+ Add Exercise</button>`;
        }
      }

      if (isTrack && !editMode) html += `<div class="track-hint">Tap any weight to edit · saved to your phone · when all reps feel solid, increase the weight and update</div>`;
    }

    html += `</div>`; // section
  });

  // Week grid
  html += `<div class="week-section"><div class="section-eyebrow">Week at a Glance</div><div class="week-grid">`;
  schedule.forEach((wd,wi) => {
    const a = typeAccent(wd.type);
    const active = wi===activeDay;
    const label = wd.short;
    html += `<button class="week-btn" style="background:${active?a:'#111'};border-color:${active?a:'#1a1a1a'}" onclick="switchDay(${wi})">
      <div class="week-btn-day" style="color:${active?'rgba(255,255,255,0.8)':'#444'}">${wd.day.slice(0,3).toUpperCase()}</div>
      <div class="week-btn-emoji">${wd.emoji}</div>
      <div class="week-btn-label" style="color:${active?'rgba(255,255,255,0.6)':'#333'}">${label}</div>
    </button>`;
  });
  html += `</div></div>`;

  // Principles
  html += `<div class="principles"><div class="section-eyebrow">Programme Principles</div>`;
  PRINCIPLES.forEach(([t,n], pi) => {
    const val = lsGet(princKey(pi)) || n;
    if (editMode) {
      html += `<div class="principle">
        <div class="principle-edit-wrap">
          <div class="principle-title">${t}</div>
          <div class="principle-note" id="princ_${pi}_display">${val}</div>
          <button class="editable-tap" onclick="startFieldEdit('princ_${pi}')">✎</button>
        </div>
        <div id="princ_${pi}_edit" style="display:none">
          <textarea class="principle-textarea" id="princ_${pi}_ta" rows="3">${esc(val)}</textarea>
          <div class="edit-actions"><button class="edit-save-btn" onclick="saveField('princ','${pi}','princ_${pi}_ta')">Save</button><button class="edit-cancel-btn" onclick="cancelFieldEdit('princ_${pi}')">Cancel</button></div>
        </div>
      </div>`;
    } else {
      html += `<div class="principle"><div class="principle-title">${t}</div><div class="principle-note">${val}</div></div>`;

  html += `</div>`;

  content.innerHTML = html;

  // Re-focus weight input if editing
  if (window._wtEditing) {

  }
  if (addingTo !== null) {
    const inp = document.getElementById(`add_name_${addingTo}`);

}

function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Navigation ─────────────────────────────────────────────────────────
function toggleSection(key) {
  expandedSections[key] = expandedSections[key]===false ? true : false;
  editingEx=null; addingTo=null;
  renderContent();
}

function switchDay(i) {
  activeDay=i; expandedSections={}; editingEx=null; addingTo=null;
  render();
}

function toggleEditMode() {
  editMode=!editMode; editingEx=null; addingTo=null;
  render();
}

// ── Weight tracking ────────────────────────────────────────────────────
function startWtEdit(k) { window._wtEditing=k; renderContent(); }

function saveWt(k) {
  const inp = document.getElementById('wi_'+k);
  const val = inp ? inp.value.trim() : '';
  if (val) lsSet(k, val); else lsDel(k);
  window._wtEditing=null; renderContent();
}

function wtKeydown(e, k) {
  if (e.key==='Enter') saveWt(k);
  if (e.key==='Escape') { window._wtEditing=null; renderContent(); }
}

// ── Edit exercises ─────────────────────────────────────────────────────
function startExEdit(si, listIdx) {
  editingEx={si, listIdx}; addingTo=null; renderContent();
}

function cancelEdit() { editingEx=null; renderContent(); }

function saveExEdit(si, listIdx, ei) {
  const name = (document.getElementById(`ename_${si}_${listIdx}`)?.value||'').trim();
  const sets = (document.getElementById(`esets_${si}_${listIdx}`)?.value||'').trim();
  const note = (document.getElementById(`enote_${si}_${listIdx}`)?.value||'').trim();
  if (!name) return;

  if (ei >= 10000) {
    // It's an added exercise — update in the add list
    const raw = lsGet(addKey(activeDay,si));
    let arr = [];
    try { arr=JSON.parse(raw)||[]; } catch(e){}
    const idx = ei - 10000;
    if (arr[idx]) arr[idx] = {name,sets,note};
    lsSet(addKey(activeDay,si), JSON.stringify(arr));
  } else {
    lsSet(lsKey(activeDay,si,ei), JSON.stringify({name,sets,note}));
  }
  editingEx=null; renderContent();
}

function deleteEx(si, listIdx, ei) {
  if (ei >= 10000) {
    const raw = lsGet(addKey(activeDay,si));
    let arr = [];
    try { arr=JSON.parse(raw)||[]; } catch(e){}
    arr.splice(ei-10000, 1);
    if (arr.length) lsSet(addKey(activeDay,si), JSON.stringify(arr));
    else lsDel(addKey(activeDay,si));
    // Rebuild order without this item
    const exList = sectionExercises(activeDay, si);
    const newList = exList.filter(e => e._ei !== ei);
    saveOrder(activeDay, si, newList);
  } else {
    lsSet(delKey(activeDay,si,ei), '1');
    const exList = sectionExercises(activeDay, si);
    const newList = exList.filter(e => e._ei !== ei);
    saveOrder(activeDay, si, newList);
  }
  editingEx=null; renderContent();
}

// ── Add exercises ──────────────────────────────────────────────────────
function startAdd(si) { addingTo=si; editingEx=null; renderContent(); }
function cancelAdd()  { addingTo=null; renderContent(); }

function confirmAdd(si) {
  const name = (document.getElementById(`add_name_${si}`)?.value||'').trim();
  const sets = (document.getElementById(`add_sets_${si}`)?.value||'').trim();
  const note = (document.getElementById(`add_note_${si}`)?.value||'').trim();
  if (!name) return;
  const raw = lsGet(addKey(activeDay,si));
  let arr = [];
  try { arr=JSON.parse(raw)||[]; } catch(e){}
  arr.push({name,sets:sets||'—',note});
  lsSet(addKey(activeDay,si), JSON.stringify(arr));
  addingTo=null; renderContent();
}

// ── Drag to reorder (touch) ────────────────────────────────────────────
function dragStart(e, si, listIdx) {
  const exList = sectionExercises(activeDay, si);
  dragState = { si, listIdx, startY: e.touches[0].clientY, exList: [...exList], currentIdx: listIdx };
  e.target.closest('.ex-row').style.opacity = '0.5';
  e.stopPropagation();
}

function dragMove(e) {
  if (!dragState) return;
  e.preventDefault();
  const y = e.touches[0].clientY;
  const dy = y - dragState.startY;
  const rowHeight = 56;
  const steps = Math.round(dy / rowHeight);
  const newIdx = Math.max(0, Math.min(dragState.exList.length-1, dragState.listIdx + steps));
  if (newIdx !== dragState.currentIdx) {
    dragState.currentIdx = newIdx;
    // Visual feedback: reorder DOM temporarily
    const list = document.getElementById(`exlist_${dragState.si}`);
    if (list) {
      const rows = Array.from(list.querySelectorAll('.ex-row'));
      rows.forEach((r,i) => r.style.background = i===newIdx ? '#1a1a1a' : '');
    }
  }
}

function dragEnd(e, si) {
  if (!dragState) return;
  const y = e.changedTouches[0].clientY;
  const dy = y - dragState.startY;
  const rowHeight = 56;
  const steps = Math.round(dy / rowHeight);
  const newIdx = Math.max(0, Math.min(dragState.exList.length-1, dragState.listIdx + steps));

  if (newIdx !== dragState.listIdx) {
    const arr = [...dragState.exList];
    const [moved] = arr.splice(dragState.listIdx, 1);
    arr.splice(newIdx, 0, moved);
    saveOrder(activeDay, si, arr);
  }

  dragState = null;
  renderContent();
}

// ── Field editing (back note, section notes, principles) ──
function startFieldEdit(id) {
  const editDiv = document.getElementById(`${id}_edit`);
  const displayDiv = document.getElementById(`${id}_display`);
  if (editDiv) editDiv.style.display = 'block';
  if (displayDiv) displayDiv.style.display = 'none';
  const ta = document.getElementById(`${id}_ta`);
  if (ta) { ta.focus(); ta.selectionStart = ta.value.length; }
}

function cancelFieldEdit(id) {
  const editDiv = document.getElementById(`${id}_edit`);
  const displayDiv = document.getElementById(`${id}_display`);
  if (editDiv) editDiv.style.display = 'none';
  if (displayDiv) displayDiv.style.display = '';
}

function saveField(type, id, taId) {
  const ta = document.getElementById(taId);
  const val = ta ? ta.value.trim() : '';
  if (type === 'backnote') {
    const di = parseInt(id);
    if (val) lsSet(backNoteKey(di), val); else lsDel(backNoteKey(di));
  } else if (type === 'secnote') {
    const [di, si] = id.split('_').map(Number);
    if (val) lsSet(secNoteKey(di,si), val); else lsDel(secNoteKey(di,si));
  } else if (type === 'princ') {
    const pi = parseInt(id);
    if (val) lsSet(princKey(pi), val); else lsDel(princKey(pi));
  }
  renderContent();
}

// ── Init ───────────────────────────────────────────────────────────────
window._wtEditing = null;
render();
</script>
